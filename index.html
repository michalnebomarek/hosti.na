<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Osobní Vizitka</title>
    <style>
        /* Moderní CSS stylování (vibe coding design) */
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --card-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-color), #ec4899);
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }

        .subtitle {
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .bio {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: 2px solid #334155;
            padding: 0.8rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Místo emoji můžete později vložit klasický obrázek <img src="foto.jpg"> -->
        <div class="profile-img">🚀</div>
        
        <h1>Ahoj, já jsem Alex</h1>
        <div class="subtitle">Vibe Coder & Nadšenec</div>
        
        <p class="bio">
            Tohle je můj první web vytvořený pomocí AI bez placení za hosting a doménu. Baví mě zkoušet nové technologie a tvořit věci na internetu.
        </p>

        <div class="links">
            <a href="https://github.com" target="_blank" class="btn">Můj GitHub</a>
            <a href="mailto:vas-email@seznam.cz" class="btn">Napiš mi</a>
        </div>
    </div>

</body>
</html>
